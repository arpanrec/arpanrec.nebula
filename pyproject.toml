[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.pylint.main]
py-version = "3.12"
jobs = 0

[tool.pylint."FORMAT"]
max-line-length = 120
indent-string = '    '

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Import sorting is isort's job and formatting is black's; only the checks that don't
# overlap either tool are enabled here.
select = ["E", "F", "W", "B", "UP", "SIM", "C4"]

[tool.pyright]
include = ["plugins"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[project]
name = "arpanrec-nebula"
version = "1.17.0"
description = "common ansible resources"
authors = [ { name = "arpan", email = "me@arpanrec.com" } ]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "ansible==14.3.1",
    "cachier==4.2.0",
    "passlib==1.7.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "docker==7.2.0",
    "isort==9.0.1",
    "molecule==26.8.0",
    "molecule-plugins==26.7.15",
    "mypy==2.3.1",
    "neovim==0.3.1",
    "pylint==4.0.8",
    "pyright==1.1.411",
    "ruff==0.16.5",
    "types-pyyaml==6.0.12.20260815",
    "yamllint==1.38.0",
    "ansible-lint==26.8.0",
    "antsibull-docs==2.26.0",
]
