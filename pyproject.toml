[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pylint."FORMAT"]
max-line-length = 120
indent-string = '    '

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[project]
name = "arpanrec-nebula"
version = "1.14.69"
description = "common ansible resources"
authors = [ { name = "arpan", email = "me@arpanrec.com" } ]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "ansible==14.2.0",
    "cachier==4.2.0",
    "passlib==1.7.4",
    "requests==2.34.2",
    "cryptography==50.0.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "docker==7.2.0",
    "isort==8.0.1",
    "molecule==26.6.0",
    "molecule-plugins==26.7.15",
    "mypy==2.3.0",
    "neovim==0.3.1",
    "pylint==4.0.6",
    "pyright==1.1.411",
    "types-pyyaml==6.0.12.20260724",
    "types-requests==2.33.0.20260712",
    "yamllint==1.38.0",
    "ansible-lint==26.6.0",
    "antsibull-docs==2.25.0",
]
