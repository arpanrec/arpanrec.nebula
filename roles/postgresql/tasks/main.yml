---
- name: PostgreSQL | Verify Cluster Name
  ansible.builtin.fail:
      msg: "The 'postgresql_cluster' variable must be set and not include any spaces or special characters.
          https://www.postgresql.org/message-id/E7F3EFD1-82A2-47BB-833D-EFA6BBD66969%40dnservices.co.za"
  when: postgresql_cluster is not ansible.builtin.defined or postgresql_cluster | ansible.builtin.length < 1
      or postgresql_cluster is ansible.builtin.search("([^a-z0-9_])")
      or postgresql_cluster is ansible.builtin.search(" ")

- name: PostgreSQL | Install Client
  ansible.builtin.import_tasks: install-client.yml

- name: PostgreSQL | Install Packages
  ansible.builtin.apt:
      name:
          - postgresql-{{ postgresql_version }}
          - postgresql-contrib-{{ postgresql_version }}
      state: present
      update_cache: true

- name: PostgreSQL | Populate Service Facts
  when: false
  ansible.builtin.service_facts:

- name: PostgreSQL | Disable Existing PostgreSQL Services
  ansible.builtin.systemd_service:
      name: "{{ __postgresql_existing_service }}"
      state: stopped
      enabled: false
  when: false
  # when: postgresql_pg_ctlcluster_systemd_service_name in __postgresql_existing_service
  #     or
  #     'postgresql.service' in __postgresql_existing_service
  loop: "{{ __postgresql_known_systemd_services | ansible.builtin.map(attribute='name') }}"
  loop_control:
      loop_var: __postgresql_existing_service
  vars:
      __postgresql_known_systemd_services: "{{ ansible_facts.services.values()
          | ansible.builtin.selectattr('source', 'equalto', 'systemd')
          | ansible.builtin.selectattr('state', 'equalto', 'running')
          + ansible_facts.services.values()
          | ansible.builtin.selectattr('source', 'equalto', 'systemd')
          | ansible.builtin.selectattr('status', 'equalto', 'enabled') }}"

- name: PostgreSQL | Generate Locales
  community.general.locale_gen:
      name: "{{ postgresql_locales }}"
      state: present
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Make Sure PostgreSQL Group Exists
  ansible.builtin.group:
      name: "{{ postgresql_service_group }}"
      system: true

- name: PostgreSQL | Make Sure PostgreSQL User Exists
  ansible.builtin.user:
      name: "{{ postgresql_service_user }}"
      create_home: false
      move_home: false
      home: "{{ postgresql_service_user_home }}"
      group: "{{ postgresql_service_group }}"
      groups:
          - ssl-cert
      system: true
      shell: /bin/bash
      comment: PostgreSQL administrator

- name: PostgreSQL | Create PostgreSQL Required Resource And Data Directories
  ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      mode: "{{ item.mode | ansible.builtin.default(default_value='0755') }}"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
  loop:
      - path: "{{ postgresql_default_conf_file | ansible.builtin.dirname }}"
      - path: "{{ postgresql_pg_ctlcluster_start_file | ansible.builtin.dirname }}"
      - path: "{{ postgresql_pg_ctlcluster_pg_ctl_file | ansible.builtin.dirname }}"
      - path: "{{ postgresql_conf_file | ansible.builtin.dirname }}"
      - path: "{{ postgresql_data_directory }}"
        mode: "0700"
      - path: "{{ postgresql_external_pid_file | ansible.builtin.dirname }}"
        mode: "0750"
      - path: "{{ postgresql_hba_file | ansible.builtin.dirname }}"
      - path: "{{ postgresql_ident_file | ansible.builtin.dirname }}"

- name: PostgreSQL | Create PostgreSQL Socket Directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: "{{ postgresql_unix_socket_permissions }}"
      group: "{{ postgresql_unix_socket_group }}"
  loop: "{{ postgresql_unix_socket_directories }}"
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Create PostgreSQL HBA File
  community.postgresql.postgresql_pg_hba:
      dest: "{{ postgresql_hba_file }}"
      mode: "0600"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      backup: false
      rules: "{{ postgresql_hba_rules }}"
      sort_rules: true
      state: present
      overwrite: true
      rules_behavior: conflict
      create: true
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Extra HBA File Entries
  community.postgresql.postgresql_pg_hba:
      dest: "{{ postgresql_hba_file }}"
      mode: "0600"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      backup: false
      sort_rules: false
      state: present
      overwrite: false
      rules_behavior: conflict
      create: false
      contype: "{{ item.contype | ansible.builtin.default(default_value=omit) }}"
      databases: "{{ item.databases | ansible.builtin.default(default_value=omit) }}"
      users: "{{ item.users | ansible.builtin.default(default_value=omit) }}"
      method: "{{ item.method | ansible.builtin.default(default_value=omit) }}"
      address: "{{ item.address | ansible.builtin.default(default_value=omit) }}"
      options: "{{ item.options | ansible.builtin.default(default_value=omit) }}"
      netmask: "{{ item.netmask | ansible.builtin.default(default_value=omit) }}"
  loop: "{{ postgresql_extra_hba_rules }}"
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Create PostgreSQL Ident File
  ansible.builtin.copy:
      src: "files/pg_ident.conf"
      dest: "{{ postgresql_ident_file }}"
      mode: "0600"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      remote_src: false
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Write Pg Ctlcluster Files
  ansible.builtin.copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      mode: "0644"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      backup: false
  loop:
      - src: "files/pg_ctl.conf"
        dest: "{{ postgresql_pg_ctlcluster_pg_ctl_file }}"
      - src: "files/start.conf"
        dest: "{{ postgresql_pg_ctlcluster_start_file }}"
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Include Ansible Config Overwrite Directory
  community.general.ini_file:
      path: "{{ postgresql_default_conf_file }}"
      mode: "0644"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      option: "include"
      value: "'{{ postgresql_conf_file }}'"
      no_extra_spaces: false
      backup: false
      create: true
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Overwrite PostgreSQL Configurations
  community.general.ini_file:
      path: "{{ postgresql_conf_file }}"
      mode: "0644"
      owner: "{{ postgresql_service_user }}"
      group: "{{ postgresql_service_group }}"
      option: "{{ item.option }}"
      value: "{{ item.value }}"
      no_extra_spaces: false
      backup: false
      create: true
  loop: "{{ postgresql_conf_options + postgresql_extra_conf_options }}"
  notify:
      - Restart postgresql handler

- name: PostgreSQL | SSL
  when: postgresql_ssl_cert_pem_content is ansible.builtin.defined
      and postgresql_ssl_cert_pem_content | ansible.builtin.length > 1
      and postgresql_ssl_key_pem_content is ansible.builtin.defined
      and postgresql_ssl_key_pem_content | ansible.builtin.length > 1
  block:
      - name: PostgreSQL | SSL | Create SSL Directories
        ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            mode: "{{ item.mode | ansible.builtin.default(default_value='0755') }}"
            owner: "{{ postgresql_service_user }}"
            group: "{{ postgresql_service_group }}"
        loop:
            - path: "{{ postgresql_ssl_cert_file | ansible.builtin.dirname }}"
            - path: "{{ postgresql_ssl_key_file | ansible.builtin.dirname }}"

      - name: PostgreSQL | SSL | Write DB Server Certificates
        ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
            owner: "{{ postgresql_service_user }}"
            group: "{{ postgresql_service_group }}"
            backup: false
        loop:
            - content: "{{ postgresql_ssl_cert_pem_content }}"
              dest: "{{ postgresql_ssl_cert_file }}"
              mode: "0644"
            - content: "{{ postgresql_ssl_key_pem_content }}"
              dest: "{{ postgresql_ssl_key_file }}"
              mode: "0600"
        notify:
            - Restart postgresql handler

      - name: PostgreSQL | SSL | Overwrite PostgreSQL Configurations
        community.general.ini_file:
            path: "{{ postgresql_conf_file }}"
            mode: "0644"
            owner: "{{ postgresql_service_user }}"
            group: "{{ postgresql_service_group }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            no_extra_spaces: false
            backup: false
            create: true
        loop:
            - option: ssl
              value: "'on'"
            - option: ssl_cert_file
              value: "'{{ postgresql_ssl_cert_file }}'"
            - option: ssl_key_file
              value: "'{{ postgresql_ssl_key_file }}'"
        notify:
            - Restart postgresql handler

      - name: PostgreSQL | SSL | Client CA
        when: postgresql_ssl_ca_pem_content is ansible.builtin.defined
            and postgresql_ssl_ca_pem_content | ansible.builtin.length > 1
        block:
            - name: PostgreSQL | SSL | Client CA | Create SSL Directories
              ansible.builtin.file:
                  path: "{{ postgresql_ssl_ca_file | ansible.builtin.dirname }}"
                  state: directory
                  mode: "{{ '0755' }}"
                  owner: "{{ postgresql_service_user }}"
                  group: "{{ postgresql_service_group }}"

            - name: PostgreSQL | SSL | Client CA | Write DB CA Certificate
              ansible.builtin.copy:
                  content: "{{ postgresql_ssl_ca_pem_content }}"
                  dest: "{{ postgresql_ssl_ca_file }}"
                  mode: "0644"
                  owner: "{{ postgresql_service_user }}"
                  group: "{{ postgresql_service_group }}"
                  backup: false
              notify:
                  - Restart postgresql handler

            - name: PostgreSQL | SSL | Client CA | Overwrite PostgreSQL Configurations
              community.general.ini_file:
                  path: "{{ postgresql_conf_file }}"
                  mode: "0644"
                  owner: "{{ postgresql_service_user }}"
                  group: "{{ postgresql_service_group }}"
                  option: "ssl_ca_file"
                  value: "'{{ postgresql_ssl_ca_file }}'"
                  no_extra_spaces: false
                  backup: false
                  create: true
              notify:
                  - Restart postgresql handler

- name: PostgreSQL | Ensure PostgreSQL Database Is Initialized
  ansible.builtin.command:
      argv:
          - "{{ postgresql_bin_directory }}/initdb"
          - -D
          - "{{ postgresql_data_directory }}"
          - "--username={{ postgresql_super_user }}"
      creates: "{{ postgresql_data_directory }}/PG_VERSION"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true
  notify:
      - Restart postgresql handler

- name: PostgreSQL | Flush Handlers
  ansible.builtin.meta: flush_handlers

- name: PostgreSQL | Enable PostgreSQL Systemd Service
  ansible.builtin.systemd_service:
      name: "{{ postgresql_pg_ctlcluster_systemd_service_name }}"
      enabled: true
      state: started
      daemon_reload: true

- name: PostgreSQL | Reset Superuser Password
  when: postgresql_super_user_password is ansible.builtin.defined
      and postgresql_super_user_password | ansible.builtin.length > 1
  community.postgresql.postgresql_user:
      name: "{{ postgresql_super_user }}"
      password: "{{ postgresql_super_user_password }}"
      login_db: "{{ postgresql_super_user_db }}"
      login_user: "{{ postgresql_super_user }}"
      login_port: "{{ postgresql_port }}"
      login_unix_socket: "{{ postgresql_unix_socket_directories[0] }}"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true
  environment:
      PGOPTIONS: "{{ (postgresql_auth_method == 'scram-sha-256')
          | ansible.builtin.ternary(true_val='-c password_encryption=scram-sha-256', false_val='') }}"

- name: PostgreSQL | Ensure PostgreSQL Users Are Present
  community.postgresql.postgresql_user:
      name: "{{ item.name }}"
      password: "{{ item.password | ansible.builtin.default(default_value=omit) }}"
      login_db: "{{ item.login_db | ansible.builtin.default(default_value=postgresql_super_user_db) }}"
      login_host: "{{ item.login_host | ansible.builtin.default(default_value='localhost') }}"
      login_password: "{{ item.login_password | ansible.builtin.default(default_value=omit) }}"
      login_user: "{{ item.login_user | ansible.builtin.default(default_value=postgresql_super_user) }}"
      login_unix_socket: "{{ item.login_unix_socket
          | ansible.builtin.default(default_value=postgresql_unix_socket_directories[0]) }}"
      login_port: "{{ item.login_port
          | ansible.builtin.default(default_value=item.port
              | ansible.builtin.default(default_value=postgresql_port)) }}"
  with_items: "{{ postgresql_users }}"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true
  environment:
      PGOPTIONS: "{{ (postgresql_auth_method == 'scram-sha-256')
          | ansible.builtin.ternary(true_val='-c password_encryption=scram-sha-256', false_val='') }}"

- name: PostgreSQL | Ensure PostgreSQL Databases Are Present
  community.postgresql.postgresql_db:
      name: "{{ item.name }}"
      lc_collate: "{{ item.lc_collate | ansible.builtin.default(default_value='en_US.UTF-8') }}"
      lc_ctype: "{{ item.lc_ctype | ansible.builtin.default(default_value='en_US.UTF-8') }}"
      encoding: "{{ item.encoding | ansible.builtin.default(default_value='UTF-8') }}"
      template: "{{ item.template | ansible.builtin.default(default_value='template0') }}"
      login_host: "{{ item.login_host | ansible.builtin.default(default_value='localhost') }}"
      login_password: "{{ item.login_password | ansible.builtin.default(default_value=omit) }}"
      login_user: "{{ item.login_user | ansible.builtin.default(default_value=postgresql_super_user) }}"
      login_unix_socket: "{{ item.login_unix_socket
          | ansible.builtin.default(default_value=postgresql_unix_socket_directories[0]) }}"
      login_port: "{{ item.login_port | ansible.builtin.default(default_value=postgresql_port) }}"
      owner: "{{ item.owner | ansible.builtin.default(default_value=postgresql_super_user) }}"
      state: "{{ item.state | ansible.builtin.default(default_value='present') }}"
  with_items: "{{ postgresql_databases }}"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true

- name: PostgreSQL | Ensure PostgreSQL Users Are Configured Correctly
  community.postgresql.postgresql_user:
      name: "{{ item.name }}"
      password: "{{ item.password | ansible.builtin.default(default_value=omit) }}"
      encrypted: "{{ item.encrypted | ansible.builtin.default(default_value=omit) }}"
      role_attr_flags: "{{ item.role_attr_flags | ansible.builtin.default(default_value=omit) }}"
      login_db: "{{ item.login_db | ansible.builtin.default(default_value=postgresql_super_user_db) }}"
      login_host: "{{ item.login_host | ansible.builtin.default(default_value='localhost') }}"
      login_password: "{{ item.login_password | ansible.builtin.default(default_value=omit) }}"
      login_user: "{{ item.login_user | ansible.builtin.default(default_value=postgresql_super_user) }}"
      login_unix_socket: "{{ item.login_unix_socket
          | ansible.builtin.default(default_value=postgresql_unix_socket_directories[0]) }}"
      login_port: "{{ item.login_port | ansible.builtin.default(default_value=postgresql_port) }}"
      state: "{{ item.state | ansible.builtin.default(default_value='present') }}"
  with_items: "{{ postgresql_users }}"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true
  environment:
      PGOPTIONS: "{{ (postgresql_auth_method == 'scram-sha-256')
          | ansible.builtin.ternary(true_val='-c password_encryption=scram-sha-256', false_val='') }}"

- name: PostgreSQL | Ensure PostgreSQL Users Do Not Use Deprecated Privileges Settings
  ansible.builtin.debug:
      msg: "Postgresql user {{ item.name }} uses deprecated privileges settings.
          See https://github.com/geerlingguy/ansible-role-postgresql/issues/254"
  with_items: "{{ postgresql_users }}"
  loop_control:
      label: "{{ item.name }}"
  when: item.priv is ansible.builtin.defined

- name: PostgreSQL | Ensure PostgreSQL Users Privileges Are Configured Correctly
  community.postgresql.postgresql_privs:
      roles: "{{ item.roles }}"
      privs: "{{ item.privs | ansible.builtin.default(default_value=omit) }}"
      type: "{{ item.type | ansible.builtin.default(default_value=omit) }}"
      objs: "{{ item.objs | ansible.builtin.default(default_value=omit) }}"
      schema: "{{ item.schema | ansible.builtin.default(default_value=omit) }}"
      session_role: "{{ item.session_role | ansible.builtin.default(default_value=omit) }}"
      login_db: "{{ item.login_db | ansible.builtin.default(default_value=postgresql_super_user_db) }}"
      login_host: "{{ item.login_host | ansible.builtin.default(default_value='localhost') }}"
      login_password: "{{ item.login_password | ansible.builtin.default(default_value=omit) }}"
      login_user: "{{ item.login_user | ansible.builtin.default(default_value=postgresql_super_user) }}"
      login_unix_socket: "{{ item.login_unix_socket
          | ansible.builtin.default(default_value=postgresql_unix_socket_directories[0]) }}"
      login_port: "{{ item.login_port | ansible.builtin.default(default_value=postgresql_port) }}"
      state: "{{ item.state | ansible.builtin.default(default_value='present') }}"
      fail_on_role: "{{ item.fail_on_role | ansible.builtin.default(default_value=true) }}"
      grant_option: "{{ item.grant_option | ansible.builtin.default(default_value=omit) }}"
      target_roles: "{{ item.target_roles | ansible.builtin.default(default_value=omit) }}"
  with_items: "{{ postgresql_privs }}"
  become: true
  become_user: "{{ postgresql_service_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
      ansible_ssh_pipelining: true
  environment:
      PGOPTIONS: "{{ (postgresql_auth_method == 'scram-sha-256')
          | ansible.builtin.ternary(true_val='-c password_encryption=scram-sha-256', false_val='') }}"

- name: PostgreSQL | Gather The Package Facts
  ansible.builtin.package_facts:
      manager: auto

- name: PostgreSQL | Allow UFW Port
  when: "'ufw' in ansible_facts.packages and ansible_facts.packages['ufw'] | ansible.builtin.length > 0"
  community.general.ufw:
      state: enabled
      port: "{{ postgresql_port }}"
      comment: Postgresql managed by ansible easyiac init stack.
      proto: tcp
      rule: allow
      to: 0.0.0.0/0
