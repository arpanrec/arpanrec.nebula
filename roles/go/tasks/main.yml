---
- name: Golang | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Golang | Get Latest Version
  ansible.builtin.set_fact:
      __go_tmp_version_details: "{{ lookup('arpanrec.nebula.version_db', 'go',
          go_rv_version=go_rv_version) | ansible.builtin.from_json }}"

- name: Golang | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __go_rv_tarball_download_path }}"
  register: __pv_ua_golang_downloaded_file_stat

- name: Golang | Newly Downloaded | Create Download Directory
  ansible.builtin.file:
      path: "{{ go_rv_tmp_dir }}"
      state: directory
      mode: "0700"

- name: Golang | Newly Downloaded
  when: not __pv_ua_golang_downloaded_file_stat.stat.exists
  block:
      - name: "Golang | Newly Downloaded | Download Tarball"
        ansible.builtin.get_url:
            url: "{{ __go_tmp_version_details.download_link }}"
            checksum: "{{ __go_tmp_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __go_rv_tarball_download_path }}"
            mode: "0700"

      - name: Golang | Newly Downloaded | Remove Old Install Directory
        ansible.builtin.file:
            path: "{{ go_rv_install_path }}"
            state: absent

  rescue:
      - name: Golang | Newly Downloaded | Delete Tarball
        ansible.builtin.file:
            path: "{{ __go_rv_tarball_download_path }}"
            state: absent

      - name: Golang | Newly Downloaded | Fail
        ansible.builtin.fail:
            msg: "Failed to download Golang tarball"

- name: Golang | Create Install Directory
  ansible.builtin.file:
      path: "{{ go_rv_install_path }}"
      state: directory
      mode: "0700"

- name: Golang | Newly Downloaded | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __go_rv_tarball_download_path }}"
      dest: "{{ go_rv_install_path }}"
      extra_opts: [--strip-components=1]
      remote_src: true

- name: Golang | Ensure GOPATH In ~/.bashrc And ~/.zshrc
  ansible.builtin.lineinfile:
      path: "{{ item }}"
      line: 'export GOPATH="${HOME}/.go"'
      create: true
      state: present
      regexp: "^export GOPATH=.*"
      mode: "0700"
  loop:
      - "{{ ansible_facts.user_dir }}/.bashrc"
      - "{{ ansible_facts.user_dir }}/.zshrc"

- name: Golang | Install Global Packages
  ansible.builtin.command:
      cmd: "{{ go_rv_install_path }}/bin/go install {{ item }}"
      chdir: "{{ go_rv_install_path }}"
  loop: "{{ go_rv_global_installs }}"
  when: go_rv_global_installs | ansible.builtin.length > 0
  environment:
      PATH: "{{ go_rv_install_path }}/bin:{{ ansible_facts.env.PATH }}"
      GOPATH: "{{ ansible_facts.user_dir }}/.go"
  register: __go_rv_global_installs_result
  changed_when: __go_rv_global_installs_result.stderr_lines | ansible.builtin.length != 0
