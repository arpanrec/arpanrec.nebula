---
- name: Gitleaks | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Gitleaks | Create Install Directory
  ansible.builtin.file:
      path: "{{ gitleaks_rv_executable_bin_path | ansible.builtin.dirname }}"
      state: directory
      mode: "0700"

- name: Gitleaks | Get Release
  ansible.builtin.set_fact:
      __gitleaks_version_details: "{{ lookup('arpanrec.nebula.version_db', 'gitleaks',
          gitleaks_rv_version=gitleaks_rv_version) | ansible.builtin.from_json }}"

- name: Gitleaks | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __gitleaks_rv_tarball_download_path }}"
  register: __gitleaks_rv_tmp_downloaded_file_stat

- name: Gitleaks | New Download
  when: not __gitleaks_rv_tmp_downloaded_file_stat.stat.exists
  block:
      - name: Gitleaks | New Download | Create Download Directory
        ansible.builtin.file:
            path: "{{ gitleaks_rv_tmp_download_dir }}"
            state: directory
            mode: "0700"

      - name: "Gitleaks | New Download | Download Tarball"
        ansible.builtin.get_url:
            url: "{{ __gitleaks_version_details.download_link }}"
            checksum: "{{ __gitleaks_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __gitleaks_rv_tarball_download_path }}"
            mode: "0700"

  rescue:
      - name: Gitleaks | New Download | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ __gitleaks_rv_tarball_download_path }}"
            state: absent

      - name: Gitleaks | New Download | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above
- name: Gitleaks | Create Temporary Unarchive Directory
  ansible.builtin.file:
      path: "{{ __gitleaks_rv_tmp_unarchive_dir }}"
      state: directory
      mode: "0700"

- name: Gitleaks | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __gitleaks_rv_tarball_download_path }}"
      dest: "{{ __gitleaks_rv_tmp_unarchive_dir }}"
      remote_src: true
      mode: "0750"

- name: Gitleaks | Copy Bin To Dest
  ansible.builtin.copy:
      src: "{{ __gitleaks_rv_tmp_unarchive_dir }}/gitleaks"
      dest: "{{ gitleaks_rv_executable_bin_path }}"
      mode: "0755"
      remote_src: true
