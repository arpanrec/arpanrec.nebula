---
- name: Terraform | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Terraform | Create Install Directory
  ansible.builtin.file:
      path: "{{ terraform_rv_install_path }}"
      state: directory
      mode: "0700"

- name: Terraform | Get Version Details
  ansible.builtin.set_fact:
      __terraform_tmp_version_details: "{{ lookup('arpanrec.nebula.version_db', 'terraform',
          terraform_rv_version=terraform_rv_version) | ansible.builtin.from_json }}"

- name: Terraform | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __terraform_rv_tarball_download_path }}"
  register: __terraform_rv_tmp_downloaded_file_stat

- name: Terraform | New Download | Create Download Directory
  ansible.builtin.file:
      path: "{{ terraform_rv_tmp_install_cache_dir }}"
      state: directory
      mode: "0700"

- name: Terraform | New Download
  when: not __terraform_rv_tmp_downloaded_file_stat.stat.exists
  block:
      - name: "Terraform | New Download | Download Tarball"
        ansible.builtin.get_url:
            url: "{{ __terraform_tmp_version_details.download_link }}"
            checksum: "{{ __terraform_tmp_version_details.checksum | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __terraform_rv_tarball_download_path }}"
            mode: "0700"
  rescue:
      - name: Terraform | New Download | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ __terraform_rv_tarball_download_path }}"
            state: absent

      - name: Terraform | New Download | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above

- name: Terraform | New Download | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __terraform_rv_tarball_download_path }}"
      dest: "{{ terraform_rv_install_path }}"
      remote_src: true
