---
- name: Oracle JDK | Apache Maven | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __java_rv_jdk_mvn_tarball_download_path }}"
  register: __java_rv_jdk_mvn_tmp_downloaded_file_stat

- name: Oracle JDK | Apache Maven | Newly Downloaded
  when: not __java_rv_jdk_mvn_tmp_downloaded_file_stat.stat.exists
  block:
      - name: Oracle JDK | Apache Maven | Newly Downloaded | Download Tarball
        ansible.builtin.get_url:
            url: "{{ __oracle_jdk_tmp_version_details.extras.maven.download_link }}"
            checksum: "{{ __oracle_jdk_tmp_version_details.extras.maven.checksum
                | ansible.builtin.default(default_value=omit) }}"
            dest: "{{ __java_rv_jdk_mvn_tarball_download_path }}"
            mode: "0700"

      - name: Oracle JDK | Apache Maven | Newly Downloaded | Remove Old Install Directory
        ansible.builtin.file:
            path: "{{ java_rv_jdk_mvn_install_path }}"
            state: absent

  rescue:
      - name: Oracle JDK | Apache Maven | Newly Downloaded | Remove Tarball
        ansible.builtin.file:
            path: "{{ __java_rv_jdk_mvn_tarball_download_path }}"
            state: absent

      - name: Oracle JDK | Apache Maven | Newly Downloaded | Fail
        ansible.builtin.fail:
            msg: |+
                "Failed to download {{ __oracle_jdk_tmp_version_details.extras.maven.download_link }}
                to {{ __java_rv_jdk_mvn_tarball_download_path }}"
                Check the error above for more details

- name: Oracle JDK | Apache Maven | Create Install Directory
  ansible.builtin.file:
      path: "{{ java_rv_jdk_mvn_install_path }}"
      state: directory
      mode: "0700"

- name: Oracle JDK | Apache Maven | Newly Downloaded | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __java_rv_jdk_mvn_tarball_download_path }}"
      dest: "{{ java_rv_jdk_mvn_install_path }}"
      extra_opts: [--strip-components=1]
      remote_src: true
