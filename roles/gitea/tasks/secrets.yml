  ansible.builtin.slurp:
      src: "{{ __gitea_lfs_jwt_secret_file }}"
  register: __gitea_remote_lfs_jwt_secret
  when: gitea_lfs_jwt_secret is not ansible.builtin.defined
      or gitea_lfs_jwt_secret | ansible.builtin.length == 0

- name: Gitea | Secrets | Set Fact LFS JWT Secret
  ansible.builtin.set_fact:
      gitea_lfs_jwt_secret: "{{ __gitea_remote_lfs_jwt_secret['content'] | ansible.builtin.b64decode }}"
  when: gitea_lfs_jwt_secret is not ansible.builtin.defined
      or gitea_lfs_jwt_secret | ansible.builtin.length == 0

- name: Gitea | Secrets | Write The Secrets To File
  ansible.builtin.copy:
      content: "{{ item.content }}"
      dest: "{{ item.dest }}"
      mode: "0400"
      owner: "{{ gitea_service_user }}"
      group: "{{ gitea_service_group }}"
  loop:
      - content: "{{ gitea_secret_key }}"
        dest: "{{ __gitea_secret_key_file }}"
      - content: "{{ gitea_internal_token }}"
        dest: "{{ __gitea_internal_token_file }}"
      - content: "{{ gitea_oauth2_jwt_secret }}"
        dest: "{{ __gitea_oauth2_jwt_secret_file }}"
      - content: "{{ gitea_lfs_jwt_secret }}"
        dest: "{{ __gitea_lfs_jwt_secret_file }}"
