---
- name: Gitea | Secrets | Generate Gitea SECRET_KEY If Not Provided
  become: true
  become_user: "{{ gitea_service_user }}"
  ansible.builtin.shell: |+
      {{ __gitea_executable }} generate secret SECRET_KEY > {{ __gitea_secret_key_file }};
      chmod 400 {{ __gitea_secret_key_file }};
  args:
      creates: "{{ __gitea_secret_key_file }}"
      executable: /usr/bin/bash
  when: gitea_secret_key is not ansible.builtin.defined
      or gitea_secret_key | ansible.builtin.string | ansible.builtin.length == 0
  notify:
      - Gitea | Restart systemd service

- name: Gitea | Secrets | Read Gitea SECRET_KEY From File
  ansible.builtin.slurp:
      src: "{{ __gitea_secret_key_file }}"
  register: __gitea_remote_secret_key
  when: gitea_secret_key is not ansible.builtin.defined
      or gitea_secret_key | ansible.builtin.string | ansible.builtin.length == 0

- name: Gitea | Secrets | Set Fact Secret Key
  ansible.builtin.set_fact:
      gitea_secret_key: "{{ __gitea_remote_secret_key['content'] | ansible.builtin.b64decode }}"
  when: gitea_secret_key is not ansible.builtin.defined
      or gitea_secret_key | ansible.builtin.string | ansible.builtin.length == 0

- name: Gitea | Secrets | Generate Gitea INTERNAL_TOKEN If Not Provided
  become: true
  become_user: "{{ gitea_service_user }}"
  ansible.builtin.shell: |+
      {{ __gitea_executable }} generate secret INTERNAL_TOKEN > {{ __gitea_internal_token_file }};
      chmod 400 {{ __gitea_internal_token_file }};
  args:
      creates: "{{ __gitea_internal_token_file }}"
      executable: /usr/bin/bash
  when: gitea_internal_token is not ansible.builtin.defined
      or gitea_internal_token | ansible.builtin.string | ansible.builtin.length == 0
