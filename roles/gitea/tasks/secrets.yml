- name: Gitea | Secrets | Set Fact Internal Token
  ansible.builtin.set_fact:
      gitea_internal_token: "{{ __gitea_remote_internal_token['content'] | ansible.builtin.b64decode }}"
  when: gitea_internal_token is not ansible.builtin.defined
      or gitea_internal_token | ansible.builtin.string | ansible.builtin.length == 0

