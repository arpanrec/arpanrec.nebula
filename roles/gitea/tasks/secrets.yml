- name: Gitea | Secrets | Generate LFS JWT_SECRET If Not Provided
  become: true
  become_user: "{{ gitea_service_user }}"
  ansible.builtin.shell: |+
      {{ __gitea_executable }} generate secret JWT_SECRET > {{ __gitea_lfs_jwt_secret_file }};
      chmod 400 {{ __gitea_lfs_jwt_secret_file }};
  args:
      creates: "{{ __gitea_lfs_jwt_secret_file }}"
      executable: /usr/bin/bash
  when: gitea_lfs_jwt_secret is not ansible.builtin.defined
      or gitea_lfs_jwt_secret | ansible.builtin.length == 0
  notify:
      - Gitea | Restart systemd service

