---
- name: Pulumi | Prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Pulumi | Create Install Directory
  ansible.builtin.file:
      path: "{{ pulumi_rv_install_path }}"
      state: directory
      mode: "0700"

- name: Pulumi | Get Release
  ansible.builtin.set_fact:
      __pulumi_version_details: "{{ lookup('arpanrec.nebula.version_db', 'pulumi',
          pulumi_rv_version=pulumi_rv_version) | ansible.builtin.from_json }}"

- name: Pulumi | Get Downloaded File Stat
  ansible.builtin.stat:
      path: "{{ __pulumi_rv_tarball_download_path }}"
  register: __pulumi_rv_tmp_downloaded_file_stat

- name: Pulumi | New Download
  when: not __pulumi_rv_tmp_downloaded_file_stat.stat.exists
  block:
      - name: Pulumi | New Download | Create Download Directory
        ansible.builtin.file:
            path: "{{ pulumi_rv_tmp_install_cache_dir }}"
            state: directory
            mode: "0700"

      - name: "Pulumi | New Download | Download Tarball"
        ansible.builtin.get_url:
            url: "{{ __pulumi_version_details.download_link }}"
            checksum: "{{ __pulumi_version_details.checksum | ansible.builtin.default(omit) }}"
            dest: "{{ __pulumi_rv_tarball_download_path }}"
            mode: "0700"
  rescue:
      - name: Pulumi | New Download | Fail | Cleanup
        ansible.builtin.file:
            path: "{{ __pulumi_rv_tarball_download_path }}"
            state: absent

      - name: Pulumi | New Download | Fail | Fail
        ansible.builtin.fail:
            msg: Something went wrong, check the errors above

- name: Pulumi | New Download | Unarchive The Tarball
  ansible.builtin.unarchive:
      src: "{{ __pulumi_rv_tarball_download_path }}"
      dest: "{{ pulumi_rv_install_path }}"
      extra_opts:
          - "--strip-components=1"
      remote_src: true
