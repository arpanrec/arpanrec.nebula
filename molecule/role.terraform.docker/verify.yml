---
- name: Terraform | Molecule | Verify
  hosts: all
  gather_facts: true
  tasks:
      - name: Terraform | Molecule | Verify | Import Roles For Variables
        ansible.builtin.import_role:
            name: arpanrec.nebula.terraform
            tasks_from: prerequisites

      - name: Terraform | Molecule | Verify | Get Version Details
        ansible.builtin.set_fact:
            __terraform_tmp_version_details: "{{ lookup('arpanrec.nebula.version_db', 'terraform',
                terraform_rv_version=terraform_rv_version) | ansible.builtin.from_json }}"

      - name: Terraform | Molecule | Verify | Get Terraform Version From Shell
        ansible.builtin.command: terraform --version
        environment:
            PATH: "{{ terraform_rv_install_path }}:{{ ansible_facts.env.PATH }}"
        register: __terraform_rv_version_shell_result
        changed_when: false

      - name: Terraform | Molecule | Verify | Fail If Terraform Version Is Not Present
        ansible.builtin.assert:
            that: __terraform_rv_version_shell_result.stdout_lines[0] == "Terraform v"
                + __terraform_tmp_version_details.version
            success_msg: Terraform Version {{ __terraform_tmp_version_details.version }} is installed
            fail_msg: Terraform Version {{ __terraform_tmp_version_details.version }} is not installed,
                Shell result {{ __terraform_rv_version_shell_result.stdout }}
