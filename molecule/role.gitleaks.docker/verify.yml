---
- name: Gitleaks | Molecule | Verify
  hosts: all
  gather_facts: false
  tasks:
      - name: Gitleaks | Molecule | Verify | Import Roles For Variables
        ansible.builtin.import_role:
            name: arpanrec.nebula.gitleaks
            tasks_from: prerequisites

      - name: Gitleaks | Molecule | Get Release
        ansible.builtin.set_fact:
            __gitleaks_version_details: "{{ lookup('arpanrec.nebula.version_db', 'gitleaks',
                gitleaks_rv_version=gitleaks_rv_version) | ansible.builtin.from_json }}"

      - name: Gitleaks | Molecule | Verify | Get Gitleaks Version From Shell
        ansible.builtin.command:
            argv:
                - gitleaks
                - --version
        environment:
            PATH: "{{ gitleaks_rv_executable_bin_path | ansible.builtin.dirname }}:{{ ansible_facts.env.PATH }}"
        register: __gitleaks_rv_version_shell_result
        changed_when: false

      - name: Gitleaks | Molecule | Verify | Fail If Gitleaks Version Is Not Present
        ansible.builtin.assert:
            that: "__gitleaks_version_details.version == __gitleaks_rv_version_shell_result.stdout_lines[0] \
                | ansible.builtin.split | ansible.builtin.last"
            success_msg: Gitleaks Version {{ __gitleaks_version_details.version }} is installed
            fail_msg: Gitleaks Version {{ __gitleaks_version_details.version }} is not installed,
                Shell result {{ __gitleaks_rv_version_shell_result.stdout }}
