---
name: Molecule Test Role Linux Patching

"on":
    workflow_dispatch:
    pull_request:
        paths:
            - "!roles/linux_patching/README.md"
            - ".github/workflows/molecule_test_role_linux_patching.yml"
            - "meta/**"
            - "molecule/role.linux_patching.docker/**"
            - "uv.lock"
            - "requirements.yml"
            - "roles/linux_patching/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    UV_MANAGED_PYTHON: "true"
    UV_LOCKED: "true"

jobs:
    molecule_test_role_linux_patching:
        timeout-minutes: 60
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12.13", "3.13.13", "3.14.5"]
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.3

            - name: Install uv 0.11.19
              uses: astral-sh/setup-uv@v8.2.0
              with:
                  version: 0.11.19
                  python-version: "${{ matrix.python-version }}"
                  enable-cache: true
                  cache-suffix: python-${{ matrix.python-version }}
                  cache-dependency-glob: |
                      **/uv.lock

            - name: Cache ansible
              uses: actions/cache@v5.0.5
              with:
                  path: |
                      ~/.ansible
                      ~/.cache/ansible-*
                  key: ansible-cache-py.${{ matrix.python-version }}-${{ hashFiles('**/requirements.yml') }}

            - name: Install dependencies
              run: |+
                  uv run python --version
                  uv sync --extra dev
              env:
                  UV_PYTHON: ${{ matrix.python-version }}

            - name: Run Molecule Test
              run: uv run molecule test -s role.linux_patching.docker
              env:
                  UV_PYTHON: ${{ matrix.python-version }}
